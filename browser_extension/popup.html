<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Forensics — URL Guard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 320px;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            padding: 20px 0;
        }

        .container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.35);
            text-align: center;
            width: 90%;
            border: 2px solid rgba(0, 200, 255, 0.6);
        }

        h1 {
            font-size: 18px;
            color: #00cfff;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #00cfff;
            text-transform: uppercase;
        }

        ul {
            text-align: left;
            list-style: none;
            margin: 15px 0;
            padding: 0;
        }

        ul li {
            font-size: 13px;
            color: #bfbfbf;
            padding: 4px 0;
            position: relative;
            padding-left: 20px;
        }

        ul li::before {
            content: "•";
            color: #00cfff;
            position: absolute;
            left: 5px;
            font-size: 15px;
        }

        p {
            font-size: 13px;
            color: #bfbfbf;
            margin: 12px 0;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            color: #00cfff;
            background-color: #222;
            border: 2px solid #00cfff;
            outline: none;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Email Forensics<br>URL Guard</h1>

        <ul>
            <li>Auto-blocks URLs flagged by email scans</li>
            <li>Closes phishing tabs the moment you click</li>
            <li>Live deep scan: VirusTotal, Safe Browsing, RDAP</li>
            <li>Continuous monitoring of flagged URLs</li>
        </ul>

        <p id="status-text">Checking backend…</p>
        <p id="result-text" class="result-text"></p>

        <div class="button-container">
            <button id="scan-button">Scan URL</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
